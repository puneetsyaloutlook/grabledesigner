<!doctype html>
<html lang="en">

    <title>Grid &amp; Table Designer</title>
    <meta name="description" content="Encouraging your data display behaviour." />

    <!-- Open Graph: the image, title and description LinkedIn, Slack and
         similar link previews read. og:image needs an absolute URL, not a
         relative one, since the crawler fetching it has no page to resolve
         a relative path against. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://grabledesigner.vercel.app/" />
    <meta property="og:title" content="Grid & Table Designer" />
    <meta property="og:description" content="Encouraging your data display behaviour." />
    <meta property="og:image" content="https://grabledesigner.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Grid & Table Designer" />
    <meta name="twitter:description" content="Encouraging your data display behaviour." />
    <meta name="twitter:image" content="https://grabledesigner.vercel.app/og-image.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&family=Lora:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet" />
